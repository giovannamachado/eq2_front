name: eq_front
description: "Front-end Flutter para teleoperação do braço robótico Kinova Gen3 Lite."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8


  google_fonts: ^6.2.1

  web_socket_channel: ^3.0.1


  get_it: ^8.0.2


  signals: ^7.1.0


  go_router: ^18.0.0


  flutter_dotenv: ^5.2.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
